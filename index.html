{nombre:'Mamadou',titulo:'Un contrato de 25 horas',via:'Arraigo sociolaboral',intro:'Mamadou lleva dos años y dos meses en España, tiene padrón histórico y carece de antecedentes. Un restaurante está dispuesto a firmarle un contrato de camarero de 25 horas con salario proporcional al convenio.',url:'https://www.inclusion.gob.es/web/migraciones/w/29.-autorizacion-de-residencia-temporal-por-circunstancias-excepcionales.-arraigo-sociolaboral.',pasos:[

{nombre:'Yulimar',titulo:'Una pareja sin registrar',via:'Residencia de familiar de persona española',intro:'Yulimar, venezolana, convive en Madrid con Carlos, español, desde hace 14 meses. Tienen alquiler conjunto y cuentas compartidas.',url:'https://www.inclusion.gob.es/es/web/migraciones/w/18.-autorizacion-de-residencia-temporal-de-familiares-de-personas-con-nacionalidad-espanola',pasos:[

resumen:[['Vínculo','Pareja estable de persona española.'],['Prueba','Al menos doce meses continuados de convivencia acreditada en este caso.'],['Trabajo','Habilitación provisional desde la presentación en el supuesto de pareja estable.']],
docs:[['Solicitud e identidad','EX-24 firmado por Yulimar, copia completa de su pasaporte o título de viaje en vigor y copia completa del DNI o pasaporte en vigor de Carlos. Carlos aporta declaración responsable de que no reside en España con otro cónyuge o pareja.'],['Vínculo','Alquiler conjunto y pruebas fechadas de convivencia. El padrón histórico o colectivo se solicita al ayuntamiento. Si existe descendencia común, revisa la documentación específica en la hoja.'],['Otros documentos','En el supuesto de solicitud desde España, la hoja 18 exceptúa la aportación de certificado médico y del certificado extranjero de antecedentes. Para una solicitud desde el extranjero, consulta esas exigencias. Traduce oficialmente y legaliza o apostilla los documentos públicos extranjeros cuando corresponda.'],['Presentación','Con ambos en España, puede presentar cualquiera de los dos ante la Oficina de Extranjería competente o por Mercurio. El procedimiento es gratuito.']]},
{nombre:'Ahmed',titulo:'Dos cursos y necesidad de ingresos',via:'Arraigo socioformativo',intro:'Ahmed lleva dos años en España. Le interesa un grado medio de FP o una formación de instalaciones eléctricas promovida por el servicio de empleo. Necesita ingresos para mantenerse.',url:'https://www.inclusion.gob.es/es/web/migraciones/w/30.-autorizacion-residencia-temporal-por-circunstancias-excepcionales.-arraigo-socioformativo',pasos:[

['¿Qué documento adicional debe pedir?',['Informe de integración social','Una oferta de 40 horas','Una carta de un compañero'],0,'El informe de integración social es requisito de esta vía. Comprueba también cuándo se puede presentar la solicitud y cómo acreditar la matrícula.'],
['Con el arraigo concedido, le ofrecen 35 horas. ¿Encaja?',['Sí, si es en el sector del curso','Debe ajustar la jornada a un máximo total de 30 horas por cuenta ajena','Sí, si el salario supera el mínimo'],1,'Puede trabajar por cuenta ajena hasta 30 horas semanales en total, con salario proporcional. Si procede aportar matrícula después, el plazo es de tres meses desde la notificación de concesión.']],

const novedades=[
['Identificación y permanencia','Se admitía copia completa incluso caducada del pasaporte, cédula de inscripción o título de viaje reconocido. Las dos fechas a comprobar son el requisito anterior al 1 de enero de 2026 para cada vía y los cinco meses ininterrumpidos inmediatamente anteriores a la solicitud. Se admite cualquier prueba válida que identifique a la persona.',rd],

['Protección internacional y TIE','En la DA 20.ª, cuando quede pendiente la solicitud de protección internacional o el recurso correspondiente, tras la concesión se presenta el desistimiento y se acredita con su resguardo al solicitar la TIE. La residencia produce plenos efectos desde su concesión.',rd],

['Piloto de cita automática en Murcia','La comunicación de la Policía de octubre de 2026 describe un piloto parcial. La cita asignada se comunica por correo electrónico y SMS. Sus instrucciones remiten a pedir cita ordinaria si transcurren 20 días desde la notificación sin asignación. Para la regularización extraordinaria, comprueba las instrucciones de la resolución y el plazo de un mes para solicitar la TIE.','https://icab.es/export/sites/icab/.galleries/documents-formacio/2012/NOTA_ProyectoPilotoAsignacionAutomaticaCitaTomaHuella.pdf']];

['Llevo meses esperando. ¿Puedo trabajar?','El resguardo acredita el registro. La comunicación de inicio tras la admisión activa la habilitación provisional para residir y trabajar por cuenta propia o ajena en toda España. Si ya hay admisión, la guía ministerial indica que la habilitación sigue mientras se espera la resolución expresa. El plazo de resolución se cuenta desde el día siguiente a la entrada en el registro competente, puede suspenderse y su vencimiento sin notificación tiene efecto desestimatorio por silencio. Revisa el canal de notificación elegido y el portal de expedientes.',faq],
['Me piden subsanar. ¿Qué hago?','Lee la notificación y anota la fecha, lo que se pide, el plazo y el canal. La regla general es de diez días hábiles salvo previsión distinta. Aporta la documentación y guarda el justificante.', 'https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565#a68'],
['¿Cómo pago la tasa?','Para la autorización, usa el modelo 790-052 con el NIE. Sigue el plazo de la comunicación y guarda y aporta el justificante. La tasa de expedición de la TIE es la 790-012 de Policía.',faq],
['Tengo favorable. ¿Espero el SMS o pido cita?','Lee las instrucciones de la resolución. Si se asigna una cita por el piloto, comprueba fecha, lugar y documentación. La guía oficial indica solicitar la TIE dentro de un mes desde la notificación de la concesión. Verifica en Policía la cita, el formulario, la identificación, la foto y la tasa.','https://www.policia.es/_es/extranjeria_extranjeros.php'],
['Mi autorización va a caducar. ¿Qué puedo solicitar?','Revisa primero si procede una modificación del artículo 191. La ventana es de dos meses previos o tres meses posteriores a la caducidad. La solicitud en ese periodo prorroga la validez hasta la resolución, con la posible consecuencia sancionadora si se presenta después de caducar. Si la modificación no es viable, cabe estudiar una prórroga de un año por inscripción y búsqueda activa de empleo o por informe autonómico favorable de esfuerzo de integración. Se prevén cuatro años en determinados supuestos acreditados que impiden acceder al empleo o al alcanzar la edad legal de jubilación. La duración de una modificación depende de la vía aplicable.',rd],
['Quedan pocos meses. ¿Puedo solicitar la TIE?','El umbral de más de seis meses se refiere a la duración concedida de la autorización. La TIE refleja la vigencia de la autorización que documenta. Si ya se ha solicitado una modificación, conserva el resguardo y revisa qué acredita junto con la fecha de la tarjeta.','https://www.policia.es/_es/extranjeria_extranjeros.php'],
['Me han denegado o archivado el expediente. ¿Qué llevo a la consulta?','Lleva la resolución completa, fecha de notificación, resguardo inicial y justificantes. Comprueba el pie de recursos para identificar plazo y vía. Tras la denegación se pierde la habilitación laboral provisional.',faq]];

const openingClues=[
 'Para valorar un contrato, fijaos en tres datos: jornada semanal, salario proporcional y posibilidad de sumar varios contratos.',
 'Las autorizaciones por vínculo familiar distinguen entre matrimonio, pareja registrada y pareja estable acreditada. Pensad qué pruebas tiene Yulimar.',

function renderQuestion(){
 const c=casos[current];
 const [question,options,correct,reason]=c.pasos[step];
 app.innerHTML=baseCase(c)+'<section class="card"><p class="status">Decisión '+(step+1)+' de '+c.pasos.length+'</p>'+(step===0?'<p class="case-clue"><strong>Antes de elegir.</strong> '+openingClues[current]+'</p>':'')+'<h3 tabindex="-1">'+question+'</h3><div class="options">'+options.map((label,i)=>'<button aria-pressed="false" data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+label+'</button>').join('')+'</div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><button id="next" hidden>'+(step+1===c.pasos.length?'Ver solución e infografía':'Abrir la siguiente decisión')+'</button></section>';
 const feedback=document.querySelector('#feedback');
 const next=document.querySelector('#next');
 const choices=[...document.querySelectorAll('[data-answer]')];
 choices.forEach(choice=>choice.onclick=()=>{
  const chosen=Number(choice.dataset.answer);
  const isCorrect=chosen===correct;
  choices.forEach(button=>button.setAttribute('aria-pressed',String(button===choice)));
  feedback.dataset.result=isCorrect?'correct':'incorrect';
  feedback.textContent=isCorrect
   ? 'Respuesta correcta. '+reason
   : 'Respuesta incorrecta. Elegiste «'+options[chosen]+'». '+reason;
  next.hidden=!isCorrect;
 });
 next.onclick=()=>{
  step++;
  if(step===c.pasos.length){finishCase(c);jump('h2');}
  else{renderQuestion();jump('h3');}
 };
}

function pictogram(label){
 const rules=[
  [/identidad/i,'id'],[/permanencia|fecha|historial|caducar|meses|enero|junio/i,'date'],
  [/antecedentes|admisión|resolución favorable/i,'check'],[/contrato|empleo|trabajo|empresa/i,'work'],
  [/vínculo/i,'people'],[/estudios|formación/i,'study'],[/derivación|deniegan/i,'arrow']
 ];
 const rule=rules.find(([pattern])=>pattern.test(label));
 const path=pictograms[rule?rule[1]:'file'];
 return '<span class="info-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+path+'"/></svg></span>';
}

function jump(selector){

function route(focus){
 const hash=location.hash.slice(1);
 const match=/^caso-([0-5])$/.exec(hash);

 else home();
 if(interactiveGuides.some(guide=>guide.id===hash)){jump('#'+hash+' h3');}
 else if(focus){window.scrollTo(0,0);jump('h1,h2');}
}
